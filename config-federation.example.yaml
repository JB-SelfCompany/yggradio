# YggRadio Federation Server Configuration Example
# Copy this file to ~/.yggradio-federation/config.yaml and customize as needed

# HTTP Server Configuration
server:
  # Port to listen on
  port: 9000

  # Bind address
  # "[::]" = all IPv6 addresses (will auto-detect Yggdrasil)
  # Or specify custom address like "[200:1234::1]"
  bind: "[::]"

  # Instance name
  instance_name: "YggRadio Federation Server"

  # HTTP timeouts
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

# Database Configuration
database:
  # SQLite database path (~ will be expanded to home directory)
  path: "~/.yggradio-federation/federation.db"

# Federation Configuration
federation:
  # How often to pull stations from registered nodes (seconds)
  pull_interval: 300  # 5 minutes

  # Node timeout - mark node as offline after this many seconds without heartbeat
  node_timeout: 60  # 1 minute

  # Maximum consecutive pull failures before marking node offline
  max_consecutive_failures: 3

  # Station TTL - remove stations that haven't been updated (seconds)
  station_ttl: 3600  # 1 hour

  # Maximum stations per node (prevents spam)
  max_stations_per_node: 100

# Rate Limiting Configuration
rate_limit:
  # Node registrations per hour per IP
  registrations_per_hour: 10

  # Station queries per minute per IP
  queries_per_minute: 60

# Logging Configuration
logging:
  # Log level: debug, info, warn, error
  level: "info"

  # Log format: json, text
  format: "json"

  # Log output: stdout, stderr, file
  output: "stdout"

  # Log file path (logs will be written to both stdout and this file)
  log_file: "~/.yggradio-federation/federation.log"
